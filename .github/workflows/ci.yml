name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d chatbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: django_server/requirements-dev.txt

      - name: Install dependencies
        working-directory: django_server
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: django_server
        run: ruff check .

      - name: Test (pytest)
        working-directory: django_server
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint .

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright's browser
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Bring up the stack
        run: docker compose up -d --build

      - name: Wait for backend and frontend to be reachable
        run: |
          timeout 120 bash -c 'until curl -fs http://localhost:8000/health/; do sleep 2; done'
          timeout 120 bash -c 'until curl -fs http://localhost:3000; do sleep 2; done'

      - name: Run Playwright smoke tests
        working-directory: frontend
        run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
