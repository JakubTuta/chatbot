services:
  postgres:
    image: postgres:16-alpine
    ports:
      - 5432:5432
    networks:
      - default
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    pull_policy: always

  server:
    build:
      context: django_server
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    pull_policy: build

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    networks:
      - default
    pull_policy: build

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: chatbot-network
    driver: bridge
