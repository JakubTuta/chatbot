services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - default
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatbot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    pull_policy: always

  redis:
    image: redis:7-alpine
    ports:
      # Loopback-only, like postgres. Published so that running the backend
      # from source (outside compose) can still reach the channel layer.
      - 127.0.0.1:6379:6379
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    pull_policy: always

  server:
    build:
      context: django_server
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    pull_policy: build

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - default
    pull_policy: build

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: chatbot-network
    driver: bridge
